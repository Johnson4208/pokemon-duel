<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokémon · Pixel Effects</title><link rel="stylesheet" href="style.css?v=pixel-v7"><style>body{background:#f8f7ef;color:#343f38;font-family:system-ui,sans-serif;padding:40px 24px}.preview-page{max-width:1180px;margin:auto}h1{font-size:38px;margin:12px 0}p{line-height:1.6}.preview-board{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin:28px 0}.preview-card{border:1px solid #d8decf;border-radius:16px;overflow:hidden;background:white}.mini-arena{height:auto;aspect-ratio:250/150;position:relative;background:#dce8d0;overflow:hidden;border-bottom:4px solid #acc48e}.mini-arena:before{content:'';position:absolute;inset:0;background:linear-gradient(#cfe1d8 0 46%,#bcd294 46% 53%,#d4e2af 53%)}.preview-mon{position:absolute;width:24%;height:38%;object-fit:contain;image-rendering:pixelated}.preview-self{left:11%;top:49%}.preview-enemy{left:66%;top:18%}.preview-copy{padding:20px}.preview-copy h2{font-size:20px;margin:0 0 8px}.preview-copy p{font-size:14px;min-height:64px;margin:0 0 16px;color:#697467}.preview-copy button{border:0;background:#626646;color:white;padding:10px 16px;border-radius:8px;font-weight:700;cursor:pointer}.preview-card .move-fx{z-index:3}.paused .px-frame{opacity:0;animation:none!important}.paused .px-frame:nth-child(5){opacity:1}.paused .fx-number{display:none}.preview-controls{display:flex;gap:24px;align-items:center;flex-wrap:wrap}a{color:#5a6143}.preview-kicker{letter-spacing:3px;font-size:12px;font-weight:700;color:#818a61}@media(max-width:760px){.preview-board{grid-template-columns:1fr}h1{font-size:29px}.preview-copy p{min-height:0}}</style><div class="preview-page"><a href="index.html">← Little Lingua</a><p class="preview-kicker">33 POKÉMON · PIXEL POWER</p><h1>Mỗi Pokémon, một màn trình diễn.</h1><p>Chọn Pokémon để xem chiêu thức. Pokémon đổi sao có thêm vòng năng lượng, hạt sáng và hiệu ứng đặc trưng theo cấp giá.</p><div class="preview-controls"><label>Pokémon <select id="pokemon-picker"></select></label><label><input id="freeze" type="checkbox" checked> Dừng ở khung va chạm để xem rõ</label><span>8 khung hình cho mỗi hiệu ứng</span></div><div class="preview-board" id="previews"></div><p>Hiệu ứng này cũng được sử dụng trong trận đấu. <a href="index.html#play">Vào Play để chiến đấu →</a></p></div><script type="module">
import {ROSTER,SHOP} from './catalog.mjs';
import {effectMarkup} from './effects.mjs?v=pixel-v7';
const board=document.getElementById('previews'),freeze=document.getElementById('freeze'),picker=document.getElementById('pokemon-picker');
picker.innerHTML=ROSTER.map(p=>`<option value="${p.id}">${p.name} · ${SHOP.find(s=>s.id===p.id)?.price?SHOP.find(s=>s.id===p.id).price+' ⭐':'Miễn phí'}</option>`).join('');
function render(){const p=ROSTER.find(p=>p.id===Number(picker.value));board.innerHTML=p.moves.map((m,i)=>`<article class="preview-card"><div class="mini-arena"><img class="preview-mon preview-self" src="${p.id}.png" alt="${p.name}"><img class="preview-mon preview-enemy" src="9.png" alt="Blastoise"><div class="move-fx paused" id="preview-${i}">${effectMarkup({type:'move',moveName:m.name,moveType:m.type,effect:m.effect,hit:true},true,p.id)}</div></div><div class="preview-copy"><h2>${m.name}</h2><p>${p.name} · ${m.type} · ${i===3?'Hỗ trợ':'Tấn công'}</p><button data-preview="${i}">▶ Xem hoạt ảnh</button></div></article>`).join('');freeze.checked=true;}
picker.onchange=render;picker.value='384';render();
freeze.onchange=()=>{for(const el of document.querySelectorAll('.move-fx')){el.classList.toggle('paused',freeze.checked);el.classList.remove('show-fx');void el.offsetWidth;if(!freeze.checked)el.classList.add('show-fx');}};
board.onclick=e=>{const b=e.target.closest('[data-preview]');if(!b)return;freeze.checked=false;for(const el of document.querySelectorAll('.move-fx'))el.classList.remove('paused');const el=document.getElementById('preview-'+b.dataset.preview);el.classList.remove('show-fx');void el.offsetWidth;el.classList.add('show-fx');};
</script></html>
