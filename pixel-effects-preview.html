<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Xem trước Pokémon · Little Lingua</title>
  <link rel="stylesheet" href="style.css?v=grand-v1">
  <style>
    :root{color-scheme:light}
    body{margin:0;padding:clamp(14px,3vw,36px);background:#f8f7ef;color:#273932;font-family:system-ui,sans-serif}
    .preview-page{max-width:1160px;margin:auto}
    .preview-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
    .preview-back{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid #dfe4d8;border-radius:12px;background:#fffefa;color:#273932;font-weight:700;text-decoration:none}
    .preview-kicker{margin:0;color:#64806c;letter-spacing:2px;font-size:11px;font-weight:800}
    h1{margin:9px 0 8px;font-size:clamp(28px,4vw,42px);line-height:1.1;letter-spacing:-1px}
    .preview-intro{max-width:720px;color:#697467;line-height:1.65;margin:0 0 22px}
    .preview-layout{display:grid;grid-template-columns:minmax(260px,.78fr) minmax(0,1.5fr);gap:20px;align-items:start}
    .preview-panel{border:1px solid #e0e4d8;border-radius:18px;background:#fffefa;padding:clamp(14px,2vw,22px);box-shadow:0 5px 20px #38462e08}
    .picker-panel{position:sticky;top:12px}
    .panel-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;font-size:17px}
    .count{color:#748179;font-size:12px;font-weight:600}
    .search-label{display:block;margin:0 0 6px;font-size:12px;font-weight:700}
    .search-input{width:100%;min-height:46px;padding:10px 12px;border:1px solid #dce2d7;border-radius:11px;background:#fff;color:#273932;font:inherit}
    .role-filters{display:flex;gap:7px;overflow:auto;padding:12px 1px 9px;scrollbar-width:thin}
    .filter-button,.pokemon-option,.preview-action,.play-all{font:inherit;cursor:pointer;touch-action:manipulation}
    .filter-button{flex:0 0 auto;min-height:38px;padding:0 11px;border:1px solid #e0e4d8;border-radius:999px;background:#fff;color:#4c5e51;font-size:12px;font-weight:700}
    .filter-button[aria-pressed=true]{border-color:#5b805f;background:#eaf2e7;color:#31543a}
    .pokemon-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-height:min(62vh,570px);overflow:auto;padding:2px 3px 4px}
    .pokemon-option{min-width:0;min-height:98px;padding:7px 4px;border:1px solid #e5e8df;border-radius:12px;background:#fff;text-align:center;color:#273932}
    .pokemon-option:hover{border-color:#a3bb9b;background:#f8fbf5}
    .pokemon-option[aria-pressed=true]{border:2px solid #5b805f;background:#eef5e9;box-shadow:0 0 0 2px #5b805f18}
    .pokemon-option img{display:block;width:54px;height:50px;object-fit:contain;margin:auto;image-rendering:pixelated}
    .pokemon-option strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
    .pokemon-option small{display:block;margin-top:2px;color:#718072;font-size:9px}
    .empty-results{grid-column:1/-1;padding:18px 8px;text-align:center;color:#697467;font-size:13px}
    .selected-heading{display:flex;align-items:center;gap:14px;padding-bottom:16px;border-bottom:1px solid #edf0e9}
    .selected-sprite{width:90px;height:90px;object-fit:contain;image-rendering:pixelated;border-radius:16px;background:#f4f5eb}
    .selected-meta{min-width:0}
    .selected-meta h2{margin:0 0 8px;font-size:24px}
    .badges{display:flex;flex-wrap:wrap;gap:6px}
    .badge{display:inline-flex;align-items:center;min-height:27px;padding:0 9px;border-radius:999px;background:#f1f3ea;color:#53644f;font-size:11px;font-weight:700}
    .role-badge{background:#f9edcf;color:#88651b}
    .preview-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 0 12px}
    .preview-toolbar p{margin:0;color:#697467;font-size:12px}
    .play-all{min-height:42px;padding:0 14px;border:0;border-radius:11px;background:#e85b49;color:white;font-weight:800;white-space:nowrap}
    .move-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
    .move-card{position:relative;overflow:hidden;border:1px solid #e4e7dd;border-radius:14px;background:#fff}
    .mini-arena{height:auto;aspect-ratio:250/150;position:relative;background:#dce8d0;overflow:hidden;border-bottom:4px solid #acc48e;isolation:isolate}
    .mini-arena:before{content:'';position:absolute;inset:0;background:linear-gradient(#cfe1d8 0 46%,#bcd294 46% 53%,#d4e2af 53%)}
    .mini-arena:after{content:'';position:absolute;left:7%;bottom:11%;width:38%;height:15%;border:4px solid #eef0bf;border-radius:50%;background:#9fbb7b;box-shadow:0 5px 0 #78925f;z-index:0}
    .preview-mon{position:absolute;z-index:1;width:24%;height:42%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 4px 0 #3d573c36)}
    .preview-self{left:11%;top:43%}
    .preview-enemy{right:11%;top:14%}
    .move-fx{z-index:2}
    .move-info{padding:13px}
    .move-title{display:flex;align-items:center;gap:8px;margin:0 0 5px;font-size:15px}
    .move-type-icon{display:inline-grid;place-items:center;width:28px;height:28px;flex:0 0 28px;border-radius:9px;background:#f3f2e8;font-size:16px}
    .move-info p{min-height:36px;margin:0 0 11px;color:#697467;font-size:12px;line-height:1.5}
    .preview-action{width:100%;min-height:42px;border:1px solid #d8e1d2;border-radius:10px;background:#f1f5ed;color:#35563a;font-weight:800}
    .preview-action:hover,.play-all:hover{filter:brightness(.97)}
    .preview-footer{margin:18px 0 0;padding-top:14px;border-top:1px solid #edf0e9;color:#697467;font-size:12px;line-height:1.6}
    .preview-footer a{color:#42684a;font-weight:700}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:820px){.preview-layout{grid-template-columns:1fr}.picker-panel{position:static}.pokemon-list{grid-template-columns:repeat(6,minmax(0,1fr));max-height:280px}}
    @media(max-width:560px){body{padding:12px}.preview-top{margin-bottom:15px}.preview-back{font-size:12px;padding:0 10px}.preview-layout{gap:12px}.pokemon-list{grid-template-columns:repeat(4,minmax(0,1fr));max-height:245px}.selected-heading{gap:10px}.selected-sprite{width:72px;height:72px}.selected-meta h2{font-size:20px}.preview-toolbar{align-items:flex-start;flex-direction:column}.play-all{width:100%}.move-grid{grid-template-columns:1fr}.mini-arena{aspect-ratio:300/145}.move-info p{min-height:0}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
<main class="preview-page">
  <header class="preview-top"><p class="preview-kicker">48 POKÉMON · HIỆU ỨNG PIXEL</p><a class="preview-back" href="index.html">← Quay lại Little Lingua</a></header>
  <h1>Chọn Pokémon, xem chiêu.</h1>
  <p class="preview-intro">Chọn một Pokémon ở danh sách, rồi bấm vào chiêu muốn xem. Hiệu ứng trong phần xem trước cũng được dùng trong trận đấu.</p>
  <div class="preview-layout">
    <section class="preview-panel picker-panel" aria-labelledby="picker-title">
      <h2 class="panel-title" id="picker-title">🐾 Chọn Pokémon <span class="count" id="pokemon-count"></span></h2>
      <label class="search-label" for="pokemon-search">Tìm theo tên</label>
      <input class="search-input" id="pokemon-search" type="search" autocomplete="off" placeholder="Ví dụ: Pikachu, Mew…">
      <div class="role-filters" id="role-filters" aria-label="Lọc theo vai trò"></div>
      <div class="pokemon-list" id="pokemon-list" aria-label="Danh sách Pokémon"></div>
    </section>
    <section class="preview-panel" aria-labelledby="selected-name">
      <div class="selected-heading" id="selected-heading"></div>
      <div class="preview-toolbar"><p id="preview-help">Chọn một chiêu để xem hiệu ứng pixel.</p><button class="play-all" id="play-all" type="button">▶ Xem cả 4 chiêu</button></div>
      <div class="move-grid" id="move-grid"></div>
      <p class="preview-footer">Muốn thử trong trận? <a href="index.html#play">Mở mục Play →</a></p>
    </section>
  </div>
</main>
<script type="module">
import {ROSTER,SHOP,ROLE_LABELS,ROLE_ICONS,TYPES} from './catalog.mjs';
import {effectMarkup,moveDelivery,DELIVERY_LABELS,targetReaction} from './effects.mjs?v=grand-v1';
const list=document.getElementById('pokemon-list'),filters=document.getElementById('role-filters'),search=document.getElementById('pokemon-search'),count=document.getElementById('pokemon-count'),heading=document.getElementById('selected-heading'),grid=document.getElementById('move-grid'),help=document.getElementById('preview-help');
let selectedId=384,activeRole='all',runTimer;
const roles=['all','striker','support','attrition','tank','balanced','legendary'];
const roleText={...ROLE_LABELS,all:'Tất cả'};
function safe(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function sprite(id,format='png',alt=''){return `<img src="${id}.${format}" data-sprite-id="${id}" data-sprite-current="${format}" alt="${safe(alt)}" onerror="window.previewSpriteFallback(this)">`;}
window.previewSpriteFallback=img=>{const id=img.dataset.spriteId,current=img.dataset.spriteCurrent;if(current==='gif'){img.dataset.spriteCurrent='png';img.src=`${id}.png`;}else if(current==='png'){img.dataset.spriteCurrent='remote';img.src=`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;}else if(current==='remote'){img.dataset.spriteCurrent='placeholder';img.src='pokeball.svg';}else img.onerror=null;};
function renderFilters(){filters.innerHTML=roles.map(role=>`<button class="filter-button" type="button" data-role="${role}" aria-pressed="${activeRole===role}">${role==='all'?'✨':ROLE_ICONS[role]||''} ${roleText[role]}</button>`).join('');}
function visiblePokemon(){const query=search.value.trim().toLocaleLowerCase();return ROSTER.filter(p=>(activeRole==='all'||p.role===activeRole)&&(!query||p.name.toLocaleLowerCase().includes(query)));}
function renderList(){const shown=visiblePokemon();count.textContent=`${shown.length} Pokémon`;list.innerHTML=shown.length?shown.map(p=>{const item=SHOP.find(s=>s.id===p.id);return `<button class="pokemon-option" type="button" data-pokemon="${p.id}" aria-pressed="${selectedId===p.id}">${sprite(p.id,'png',p.name)}<strong>${p.name}</strong><small>${item?`${item.price} ⭐`:'Miễn phí'} · ${ROLE_ICONS[p.role]} ${roleText[p.role]}</small></button>`;}).join(''):'<p class="empty-results">Không tìm thấy Pokémon. Thử tên khác nhé.</p>';}
function renderMoves(){clearInterval(runTimer);const p=ROSTER.find(x=>x.id===selectedId)||ROSTER[0],item=SHOP.find(x=>x.id===p.id);heading.innerHTML=`${sprite(p.id,'png',p.name).replace('<img ', '<img class="selected-sprite" ')}<div class="selected-meta"><h2 id="selected-name">${p.name}</h2><div class="badges"><span class="badge">${TYPES[p.type][2]} ${TYPES[p.type][0]}</span><span class="badge role-badge">${ROLE_ICONS[p.role]} ${roleText[p.role]}</span><span class="badge">${item?`${item.price} ⭐ đổi sao`:'Miễn phí'}</span></div></div>`;
 grid.innerHTML=p.moves.map((m,i)=>`<article class="move-card"><div class="mini-arena"><div class="move-fx paused" id="preview-fx-${i}">${effectMarkup({type:'move',moveName:m.name,moveType:m.type,effect:m.effect,hit:true,damage:0},true,p.id)}</div>${sprite(p.id,'gif',p.name).replace('<img ', '<img class="preview-mon preview-self" ')}${sprite(9,'png','Blastoise').replace('<img ', '<img class="preview-mon preview-enemy" ')}</div><div class="move-info"><h3 class="move-title"><span class="move-type-icon" aria-hidden="true">${TYPES[m.type][2]}</span>${m.name}</h3><p>${m.power===0?`Hỗ trợ · ${m.effect||'kỹ năng đội'}`:p.role==='attrition'?'Đòn cấu rỉa · có thể gây hiệu ứng kéo dài':`Sức mạnh ${m.power} · chính xác ${m.accuracy}%`}</p><small class="delivery-label">${DELIVERY_LABELS[moveDelivery({type:'move',moveName:m.name,moveType:m.type,effect:m.effect})]}</small><button class="preview-action" type="button" data-preview="${i}">▶ Xem chiêu ${i+1}</button></div></article>`).join('');
 renderList();help.textContent=`${p.name} có ${p.moves.length} chiêu. Bấm từng nút để xem, hoặc chạy cả bộ chiêu.`;}
function play(index){const fx=document.getElementById(`preview-fx-${index}`);if(!fx)return;fx.classList.remove('paused','show-fx');void fx.offsetWidth;fx.classList.add('show-fx');const p=ROSTER.find(x=>x.id===selectedId),m=p?.moves[index],enemy=fx.parentElement.querySelector('.preview-enemy');enemy.classList.remove('hit');if(m?.power>0){enemy.dataset.reaction=targetReaction({type:'move',moveName:m.name,moveType:m.type,effect:m.effect});void enemy.offsetWidth;enemy.classList.add('hit');}}
renderFilters();renderMoves();
filters.addEventListener('click',e=>{const b=e.target.closest('[data-role]');if(!b)return;activeRole=b.dataset.role;renderFilters();renderList();});
search.addEventListener('input',renderList);
list.addEventListener('click',e=>{const b=e.target.closest('[data-pokemon]');if(!b)return;selectedId=Number(b.dataset.pokemon);renderMoves();});
grid.addEventListener('click',e=>{const b=e.target.closest('[data-preview]');if(b)play(Number(b.dataset.preview));});
document.getElementById('play-all').addEventListener('click',()=>{clearInterval(runTimer);let i=0;play(i++);runTimer=setInterval(()=>{if(i>=4){clearInterval(runTimer);return;}play(i++);},1750);});
if(new URLSearchParams(location.search).has('embedded')){document.querySelector('.preview-back').hidden=true;const playLink=document.querySelector('.preview-footer a');playLink.href='#';playLink.textContent='Quay lại mục Play →';playLink.addEventListener('click',event=>{event.preventDefault();window.parent.postMessage({type:'lingua:show-play'},location.origin);});}
</script>
</body>
</html>
